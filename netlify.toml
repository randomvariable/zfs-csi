# Netlify build configuration for the zfs-csi documentation site.
#
# GitHub Pages (.github/workflows/docs.yml) is the canonical published site.
# This Netlify configuration exists as an alternate / preview build — for
# example, Netlify Deploy Previews on pull requests. It builds the same MkDocs
# site into the same output directory.
#
# Netlify's build image provides Python; mkdocs-material is pinned here to match
# the version in .tools.yaml so the Netlify build matches the mage/CI build.

[build]
  publish = "site"
  command = "pip install 'mkdocs-material==9.7.6' && mkdocs build --strict"

[build.environment]
  PYTHON_VERSION = "3.12"
