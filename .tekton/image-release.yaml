---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: zfs-csi-image-release
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push, tag]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    # Keep release trigger available after CI-only build infrastructure fixes.
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/task: "git-clone"
spec:
  taskRunTemplate:
    serviceAccountName: pipeline
    podTemplate:
      nodeSelector:
        kubernetes.io/arch: amd64
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [server6]
      securityContext:
        fsGroup: 65532
  timeouts:
    pipeline: 2h
    tasks: 90m
  pipelineSpec:
    params:
      - name: repo_url
        type: string
      - name: revision
        type: string
      - name: image
        type: string
        default: docker.io/randomvariable/zfs-csi
      - name: tag
        type: string
    workspaces:
      - name: source
      - name: basic-auth
      - name: docker-config
    tasks:
      - name: fetch-source
        taskRef:
          name: git-clone
        workspaces:
          - name: output
            workspace: source
          - name: basic-auth
            workspace: basic-auth
        params:
          - name: url
            value: $(params.repo_url)
          - name: revision
            value: $(params.revision)
          - name: depth
            value: "1"

      - name: build-and-push
        runAfter:
          - fetch-source
        workspaces:
          - name: source
            workspace: source
          - name: docker-config
            workspace: docker-config
        taskSpec:
          params:
            - name: image
              type: string
            - name: tag
              type: string
          workspaces:
            - name: source
            - name: docker-config
          steps:
            - name: buildctl
              image: moby/buildkit:master-rootless
              workingDir: $(workspaces.source.path)
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                  type: Unconfined
                appArmorProfile:
                  type: Unconfined
              computeResources:
                requests:
                  memory: 16Gi
                  ephemeral-storage: 20Gi
                limits:
                  memory: 56Gi
              env:
                - name: DOCKER_CONFIG
                  value: /tmp/docker
              script: |
                #!/bin/sh
                set -eu
                mkdir -p "$DOCKER_CONFIG"
                cp "$(workspaces.docker-config.path)/.dockerconfigjson" "$DOCKER_CONFIG/config.json"
                rootlesskit buildkitd --oci-worker-no-process-sandbox &
                buildkitd_pid=$!
                retries=0
                while [ ! -S /run/user/1000/buildkit/buildkitd.sock ] && [ "$retries" -lt 30 ]; do
                  sleep 1
                  retries=$((retries + 1))
                done
                buildctl build \
                  --frontend dockerfile.v0 \
                  --local context=. \
                  --local dockerfile=. \
                  --opt filename=Dockerfile \
                  --opt platform=linux/amd64,linux/arm64 \
                  --output "type=image,name=$(params.image):$(params.tag),push=true"
        params:
          - name: image
            value: $(params.image)
          - name: tag
            value: $(params.tag)
  params:
    - name: repo_url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
    - name: tag
      value: "{{ revision }}"
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
    - name: basic-auth
      secret:
        secretName: "{{ git_auth_secret }}"
    - name: docker-config
      secret:
        secretName: zfs-csi-dockerhub
