# No-op goss entry file for the zfs-csi E2E golden image build.
#
# image-builder's default goss suite (goss/goss.yaml) is its upstream release
# gate and asserts brittle, drift-prone facts (e.g. crictl returning an exact
# preloaded-image list for the pinned Kubernetes version). Those assertions are
# not meaningful for our once-per-Kubernetes-minor E2E golden image and were
# failing the build after the image itself was fully built and our own
# zfs_csi_e2e role assertions (modinfo of zfs/nvmet/nvmet_tcp/nvme_tcp/
# nvme_fabrics/configfs against the boot kernel) had already passed.
#
# The golden image is validated by our zfs_csi_e2e role at bake time and, more
# importantly, by the real E2E driver run. mage overrides goss_entry_file to
# this file (last-wins packer var). goss v0.3.23 treats a gossfile with zero
# tests as an error ("found 0 tests"), so this file carries a single trivial
# always-true assertion (root directory exists) to make goss a passing no-op.
# The image-builder checkout is never modified.
file:
  /:
    exists: true
    filetype: directory
