        - DEBIAN_FRONTEND=noninteractive apt-get install -y zfsutils-linux linux-modules-extra-$(uname -r) nfs-kernel-server nvme-cli amazon-ec2-utils
        - systemctl unmask nfs-server
        - systemctl enable --now nfs-server
        - udevadm trigger --subsystem-match=block || true
        - modprobe zfs || true
        - modprobe nvmet-tcp
        - modprobe nvme-fabrics
        - modprobe target_core_mod
        - modprobe tls
        - test "$(cat /sys/module/tls/coresize)" -gt 0
        - genl ctrl list | grep -q '^Name:.*handshake$'
        - module=$(modinfo -F filename sunrpc); case "$module" in *.zst) zstdcat "$module" ;; *.xz) xzcat "$module" ;; *.gz) gzip -dc "$module" ;; *) cat "$module" ;; esac | strings | grep -qx svc_tcp_handshake
      joinConfiguration:
        nodeRegistration:
