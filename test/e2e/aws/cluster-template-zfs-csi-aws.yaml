          kubeletExtraArgs:
            - name: cloud-provider
              value: external
            - name: feature-gates
              value: "CSIVolumeHealth=true,PodCertificateRequest=true,SELinuxMount=true"
            - name: node-labels
              value: "zfs.csi.randomvariable.co.uk/storage-owner=storage-b"
            - name: register-with-taints
