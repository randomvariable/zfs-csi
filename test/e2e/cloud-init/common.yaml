package_update: true
package_upgrade: false
packages:
  - apt-transport-https
  - ca-certificates
  - containerd
  - curl
  - gpg
  - jq
  - kubeadm
  - kubectl
  - kubelet
  - nfs-common
  - nvme-cli
write_files:
  - path: /etc/modules-load.d/zfs-csi.conf
    permissions: "0644"
    content: |
      zfs
      nvmet
      nvmet-tcp
      nvme-tcp
      nvme-fabrics
      configfs
  - path: /usr/local/sbin/zfs-csi-e2e-ready
    permissions: "0755"
    content: |
      #!/bin/sh
      set -eu
      # Real load-or-fail: the only honest proof is loading the module on the
      # running boot kernel. modprobe -n dry-runs config resolution and passes
      # even when the .ko is absent.
      modprobe zfs
      modprobe nvmet
      modprobe nvmet-tcp
      modprobe nvme-tcp
      modprobe nvme-fabrics
      test -d /sys/kernel/config
runcmd:
  - [systemctl, enable, --now, containerd]
  - [modprobe, configfs]
  - [mountpoint, -q, /sys/kernel/config]
  - [modprobe, nvme-tcp]
  - [modprobe, nvme-fabrics]
  - [/usr/local/sbin/zfs-csi-e2e-ready]
