apiVersion: e2e.zfs-csi.randomvariable.co.uk/v1alpha1
kind: InfrastructureConfig
metadata:
  name: kubevirt-two-owner
spec:
  provider: kubevirt
  flavor: zfs-csi
  addressFamilies: [ipv4, ipv6]
  storageOwners:
    - name: storage-a
      machineDeploymentSuffix: storage-a
      nodeSelector:
        zfs.csi.randomvariable.co.uk/storage-owner: storage-a
      pool:
        name: tank
        diskID: tank-a
        deviceID: /dev/disk/by-id/virtio-tank-a
      networkDomain: fabric-a
      endpoints:
        nfs: {ipv4: 10.19.1.20, ipv6: "fd19:1::20", port: 2049}
        nvme: {ipv4: 10.19.1.20, ipv6: "fd19:1::20", port: 4420}
    - name: storage-b
      machineDeploymentSuffix: storage-b
      nodeSelector:
        zfs.csi.randomvariable.co.uk/storage-owner: storage-b
      pool:
        name: tank
        diskID: tank-b
        deviceID: /dev/disk/by-id/virtio-tank-b
      networkDomain: fabric-a
      endpoints:
        nfs: {ipv4: 10.19.1.21, ipv6: "fd19:1::21", port: 2049}
        nvme: {ipv4: 10.19.1.21, ipv6: "fd19:1::21", port: 4420}
  consumerWorkers:
    - name: workers-a
      machineDeploymentSuffix: md-0
      nodeSelector: {zfs-csi.randomvariable.co.uk/consumer-group: workers-a}
      replicas: 2
      networkDomain: fabric-a
