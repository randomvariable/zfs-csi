# TLS variant of the NFS testdriver. Only registered with E2E_TRANSPORT_TLS=1.
StorageClass:
  FromExistingClassName: zfs-tank-nfs-tls
SnapshotClass:
  FromExistingClassName: zfs-tank-snapclass
VolumeAttributesClass:
  FromExistingClassName: zfs-csi-e2e-compression-zstd-3
DriverInfo:
  Name: zfs.csi.randomvariable.co.uk-nfs-tls
  PreprovisionedPV: false
  SupportedSizeRange:
    Min: 1Gi
    Max: 16Gi
  Capabilities:
    persistence: true
    block: false
    exec: true
    multipods: true
    RWX: true
    controllerExpansion: true
    nodeExpansion: false
    onlineExpansion: true
    offlineExpansion: true
    # TLS smoke does not exercise clone/snapshot lifecycle paths.
    pvcDataSource: false
    snapshotDataSource: false
    topology: false
    volumeLimits: false
    capacity: true
    singleNodeVolume: false
  RequiredAccessModes:
    - ReadWriteMany
    - ReadWriteOnce
  StressTestOptions:
    NumPods: 4
    NumRestarts: 3
