# External-storage conformance testdriver for the zfs-csi NVMe-TCP (block, RWO)
# path. Consumed by the upstream suite via `-storage.testdriver=<this>` inside
# the version-matched conformance container (see test/e2e/conformance.go).
#
# Schema: k8s.io/kubernetes/test/e2e/storage/external.driverDefinition +
# .../storage/framework.DriverInfo. Unknown keys are silently ignored — beware
# typos (upstream does no unknown-field checking).
#
# NAME is deliberately synthetic (`...-nvme`) and DISTINCT from the NFS
# testdriver's name: the external suite keys its test tree by DriverInfo.Name, so
# a shared name would collapse both drivers into one ambiguous `[Driver: ...]`
# tree with duplicate JUnit testcase names. The real provisioner comes from the
# StorageClass (FromExistingClassName), not this Name, so a synthetic value is
# safe.
StorageClass:
  # Copy the chart-installed zfs-tank-nvme SC verbatim (carries pool=tank,
  # type=block, transport=nvme-tcp, fsType=ext4, blocksize, volumeBindingMode:
  # WaitForFirstConsumer). FromName would create a bare param-less SC with no
  # pool -> provisioning fails. FromExistingClassName is the correct ref.
  FromExistingClassName: zfs-tank-nvme
SnapshotClass:
  # external-snapshotter deployed (CRDs + snapshot-controller) and the chart ships
  # the csi-snapshotter sidecar; the lane creates the zfs-tank-snapclass
  # VolumeSnapshotClass. Reference it so the snapshottable suites run.
  FromExistingClassName: zfs-tank-snapclass
VolumeAttributesClass:
  # This class is created by ensureVolumeAttributesClassInfra before the
  # conformance suite. The external framework copies it per test namespace.
  FromExistingClassName: zfs-csi-e2e-compression-zstd-3
DriverInfo:
  Name: zfs.csi.randomvariable.co.uk-nvme
  # Imports use bespoke static PVs in the dedicated lifecycle scenario, not
  # upstream's generic preprovisioned-volume adapter.
  PreprovisionedPV: false
  # ZFS provisions arbitrary sizes; keep a conservative floor/ceiling for the
  # resize + provisioning suites (avoids multi-GB [Slow] allocations on t3a).
  SupportedSizeRange:
    Min: 1Gi
    Max: 16Gi
  SupportedFsType:
    ext4: {}
  Capabilities:
    persistence: true          # data survives pod restart
    # block:true -- raw volumeMode: Block IS supported and proven live (#59):
    # the nvmet-stage sidecar binds the /dev node onto a file inside the staging
    # dir (no format), and NodePublish binds that file onto the pod target file.
    # A pod with volumeDevices sees a real block device (S_ISBLK) and does raw
    # sector I/O over NVMe-TCP.
    block: true
    exec: true                 # ext4 fs mode -> exec-in-volume works
    # Kubernetes permits an RWO filesystem PV to mount in multiple Pods on the
    # same node. The NVMe path supports this and the feature scenario verifies
    # the Pods share one PV and observe each other's writes.
    multipods: true
    RWX: false                 # block path is RWO only
    controllerExpansion: true  # RPC_EXPAND_VOLUME advertised
    nodeExpansion: true        # node RPC_EXPAND_VOLUME advertised (ext4 grow)
    onlineExpansion: true      # ext4 online grow supported (set explicit; default true)
    offlineExpansion: true     # ext4 offline grow supported (set explicit)
    pvcDataSource: true        # RPC_CLONE_VOLUME (zfs clone). Proven live: clone PVC binds + reads source data (promote-aware delete, commit 8e382dd).
    snapshotDataSource: true   # external-snapshotter deployed; proven live: snapshot ReadyToUse + restore-from-snapshot reads source data
    topology: false            # network-attached: empty AccessibleTopology (MEM 2245)
    # Upstream volumeLimits assumes every Ready schedulable node has this CSI
    # driver. Selective deployments use the dedicated scheduler limit scenario.
    volumeLimits: false
    capacity: true             # external-provisioner publishes CSIStorageCapacity from ZFS pool free bytes
    readWriteOncePod: true     # RPC_SINGLE_NODE_MULTI_WRITER + modern CSI sidecars (#61)
    singleNodeVolume: false
  # Upstream applies this one default mode set to every PVC and generic
  # ephemeral claim it creates. Keep the broad suites on ordinary RWO; its
  # dedicated RWOP suite sees readWriteOncePod above and creates an RWOP-only
  # claim itself.
  RequiredAccessModes:
    - ReadWriteOnce
  # Exercise concurrent provision/publish cycles and repeated kubelet teardown.
  # Keep the scale bounded because this suite runs both filesystem and block
  # patterns for every configured testdriver.
  StressTestOptions:
    NumPods: 4
    NumRestarts: 3
