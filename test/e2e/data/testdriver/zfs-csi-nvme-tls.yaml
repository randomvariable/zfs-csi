# TLS variant of the NVMe-TCP testdriver. Only registered with
# E2E_TRANSPORT_TLS=1.
StorageClass:
  FromExistingClassName: zfs-tank-nvme-tls
SnapshotClass:
  FromExistingClassName: zfs-tank-snapclass
VolumeAttributesClass:
  FromExistingClassName: zfs-csi-e2e-compression-zstd-3
DriverInfo:
  # Distinct from the non-TLS DriverInfo name so Kubernetes e2e keeps their
  # storage-class fixtures and cleanup bookkeeping isolated.
  Name: zfs.csi.randomvariable.co.uk-nvme-tls
  PreprovisionedPV: false
  SupportedSizeRange:
    Min: 1Gi
    Max: 16Gi
  SupportedFsType:
    ext4: {}
  Capabilities:
    persistence: true
    block: true
    exec: true
    multipods: true
    RWX: false
    controllerExpansion: true
    nodeExpansion: true
    onlineExpansion: true
    offlineExpansion: true
    pvcDataSource: true
    snapshotDataSource: true
    topology: false
    # Upstream volumeLimits assumes every Ready schedulable node has this CSI
    # driver. Selective deployments use the dedicated scheduler limit scenario.
    volumeLimits: false
    capacity: true
    readWriteOncePod: true
    singleNodeVolume: false
  RequiredAccessModes:
    - ReadWriteOnce
  StressTestOptions:
    NumPods: 4
    NumRestarts: 3
