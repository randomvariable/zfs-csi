# This negative class must be rejected by the driver before it mutates an
# existing volume because volblocksize is fixed at creation time.
apiVersion: storage.k8s.io/v1
kind: VolumeAttributesClass
metadata:
  name: zfs-csi-e2e-immutable-blocksize
driverName: zfs.csi.randomvariable.co.uk
parameters:
  compression: lz4
  blocksize: 128k
