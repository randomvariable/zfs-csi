---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: KubeadmConfigTemplate
metadata:
  name: "${CLUSTER_NAME}-md-0"
  namespace: "${NAMESPACE}"
  labels: &ownershipLabels
    app.kubernetes.io/name: zfs-csi-e2e
    app.kubernetes.io/managed-by: ginkgo-e2e
    zfs-csi.randomvariable.co.uk/run-id: "${E2E_RUN_ID}"
spec:
  template:
     spec:
       postKubeadmCommands:
         - echo success > /run/cluster-api/bootstrap-success.complete
       joinConfiguration:
         nodeRegistration:
           criSocket: "${CRI_PATH}"
           kubeletExtraArgs:
             node-labels: "zfs-csi.randomvariable.co.uk/consumer-group=workers-a,topology.zfs.csi.randomvariable.co.uk/network-domain=${CONSUMER_NETWORK_DOMAIN}"
---
# Storage owner A: independent run-owned blank pool disk. Pool GUID remains a
# live discovery result and is never encoded in this template.
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: "${CLUSTER_NAME}-storage-a"
  namespace: "${NAMESPACE}"
  labels: &ownershipLabels
    app.kubernetes.io/name: zfs-csi-e2e
    app.kubernetes.io/managed-by: ginkgo-e2e
    zfs-csi.randomvariable.co.uk/run-id: "${E2E_RUN_ID}"
spec:
  clusterName: "${CLUSTER_NAME}"
  replicas: 1
  selector:
    matchLabels: {}
  template:
    metadata:
      labels:
        zfs.csi.randomvariable.co.uk/storage-owner: storage-a
    spec:
      clusterName: "${CLUSTER_NAME}"
      version: "${KUBERNETES_VERSION}"
      bootstrap:
        configRef:
          name: "${CLUSTER_NAME}-storage-a"
          namespace: "${NAMESPACE}"
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: KubeadmConfigTemplate
      infrastructureRef:
        name: "${CLUSTER_NAME}-storage-a"
        namespace: "${NAMESPACE}"
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
        kind: KubevirtMachineTemplate
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: KubevirtMachineTemplate
metadata:
  name: "${CLUSTER_NAME}-storage-a"
  namespace: "${NAMESPACE}"
  labels: &ownershipLabels
    app.kubernetes.io/name: zfs-csi-e2e
    app.kubernetes.io/managed-by: ginkgo-e2e
    zfs-csi.randomvariable.co.uk/run-id: "${E2E_RUN_ID}"
spec:
  template:
    spec:
      virtualMachineBootstrapCheck:
        checkStrategy: ssh
      virtualMachineTemplate:
        metadata:
          namespace: "${NAMESPACE}"
        spec:
          dataVolumeTemplates:
            - metadata:
                name: "tank-a"
                labels:
                  app.kubernetes.io/name: zfs-csi-e2e
                  app.kubernetes.io/managed-by: ginkgo-e2e
                  zfs-csi.randomvariable.co.uk/run-id: "${E2E_RUN_ID}"
              spec:
                source:
                  blank: {}
                pvc:
                  accessModes:
                    - ReadWriteOnce
                  volumeMode: Block
                  resources:
                    requests:
                      storage: "${DATA_DISK_SIZE}"
                  storageClassName: "${DATA_DISK_STORAGE_CLASS}"
          runStrategy: Always
          template:
            spec:
              domain:
                ioThreadsPolicy: auto
                cpu:
                  cores: 4
                  model: host-passthrough
                memory:
                  guest: "8Gi"
                devices:
                  networkInterfaceMultiqueue: true
                  # blockMultiQueue: expose one virtio-blk queue per vCPU so
                  # the guest can parallelise disk submission across cores.
                  blockMultiQueue: true
                  disks:
                    - disk:
                        bus: virtio
                      name: boot
                      cache: writeback
                      dedicatedIOThread: true
                    # Serial belongs on pool disk, not boot disk. Guest identity
                    # is deterministic regardless of virtio enumeration order.
                    - disk:
                        bus: virtio
                      name: tank-a
                      serial: tank-a
                      cache: writeback
                      dedicatedIOThread: true
                  interfaces:
                    - name: default
                      model: virtio
                      bridge: {}
              networks:
                - name: default
                  multus:
                    default: true
                    networkName: vlan200
              evictionStrategy: External
              volumes:
                - name: boot
                  # ephemeral: a per-VM local qcow2 overlay backed by the shared
                  # read-only golden root PVC (cephfs, RWX). All node VMs mount
                  # the same golden PVC read-only and write only to their
                  # disposable overlay, so there is no per-machine CDI clone
                  # (the clone was the multi-minute boot stall) and the golden
                  # image is read once and page-cached. Overlay is discarded on
                  # VMI stop, which is fine: E2E VMs never restart mid-run.
                  ephemeral:
                    persistentVolumeClaim:
                      claimName: "${GOLDEN_ROOT_PVC}"
                - dataVolume:
                    name: "tank-a"
                  name: tank-a
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: KubeadmConfigTemplate
metadata:
  name: "${CLUSTER_NAME}-storage-a"
  namespace: "${NAMESPACE}"
  labels: &ownershipLabels
    app.kubernetes.io/name: zfs-csi-e2e
    app.kubernetes.io/managed-by: ginkgo-e2e
    zfs-csi.randomvariable.co.uk/run-id: "${E2E_RUN_ID}"
spec:
  template:
    spec:
      postKubeadmCommands:
        - echo success > /run/cluster-api/bootstrap-success.complete
      joinConfiguration:
        nodeRegistration:
          criSocket: "${CRI_PATH}"
          kubeletExtraArgs:
            node-labels: "zfs.csi.randomvariable.co.uk/storage-owner=storage-a"
            register-with-taints: "zfs.csi.randomvariable.co.uk/storage=true:NoSchedule"
---
