            register-with-taints: "zfs.csi.randomvariable.co.uk/storage=true:NoSchedule"
# CNI is installed by the E2E framework via CNIManifestPath (vendored, pinned
# Calico) after control-plane init, before the node-ready waits. The Calico
# node DaemonSet tolerates all taints, so it reaches the tainted storage node.
