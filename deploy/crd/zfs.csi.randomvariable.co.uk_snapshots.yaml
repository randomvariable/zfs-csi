---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: snapshots.zfs.csi.randomvariable.co.uk
spec:
  group: zfs.csi.randomvariable.co.uk
  names:
    kind: Snapshot
    listKind: SnapshotList
    plural: snapshots
    shortNames:
    - zsnap
    singular: snapshot
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.sourceVolumeID
      name: Source
      type: string
    - jsonPath: .status.readyToUse
      name: Ready
      type: boolean
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Snapshot is the desired + observed state of a single CSI-provisioned
          ZFS snapshot.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of the Snapshot.
            properties:
              ownerNode:
                description: ownerNode is the storage node that materialises this
                  snapshot.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: ownerNode is immutable
                  rule: self == oldSelf
              poolGUID:
                description: poolGUID is the immutable ZFS pool identity copied from
                  the source Volume.
                maxLength: 20
                minLength: 1
                pattern: ^[1-9][0-9]{0,19}$
                type: string
                x-kubernetes-validations:
                - message: poolGUID is immutable
                  rule: self == oldSelf
              snapName:
                description: snapName is the human-readable CSI snapshot name; derives
                  the ZFS snapshot leaf.
                minLength: 1
                type: string
              snapshotID:
                description: snapshotID is the CSI snapshot handle returned to the
                  snapshotter sidecar.
                minLength: 1
                type: string
              sourceVolBlockSize:
                description: |-
                  sourceVolBlockSize is the source Volume's ZFS volblocksize/recordsize at
                  snapshot time (for example "16k"). A restore clones the snapshot, so the
                  restored volume inherits this block size and its capacity must align to it.
                  The field is authoritative when the parent Volume CR no longer exists.
                  Empty on snapshots taken by older drivers and on filesystem sources.
                pattern: ^[0-9]+[kKmMgG]?$
                type: string
                x-kubernetes-validations:
                - message: sourceVolBlockSize is immutable
                  rule: self == oldSelf
              sourceVolumeID:
                description: sourceVolumeID is the CSI source volume handle.
                minLength: 1
                type: string
              volumeRef:
                description: volumeRef references the cluster-scoped parent Volume
                  CR.
                type: string
            required:
            - ownerNode
            - poolGUID
            - snapName
            - snapshotID
            - sourceVolumeID
            - volumeRef
            type: object
          status:
            description: status reports the observed state of the Snapshot.
            properties:
              conditions:
                description: conditions carries reconcile health.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              createdAt:
                description: createdAt is the ZFS snapshot creation time (unix seconds).
                format: int64
                type: integer
              datasetPath:
                description: datasetPath is the full ZFS snapshot name (e.g. tank/csi/block/<id>@<snap>).
                type: string
              observedGeneration:
                description: observedGeneration is the spec generation the controller
                  last reconciled.
                format: int64
                type: integer
              readyToUse:
                description: readyToUse mirrors the CSI snapshot readyToUse field.
                type: boolean
              size:
                description: size is the snapshot size in bytes.
                format: int64
                type: integer
              state:
                description: state is the reconcile lifecycle state.
                enum:
                - Pending
                - Ready
                - Error
                - Deleting
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: ownerNode is immutable
          rule: self.spec.ownerNode == oldSelf.spec.ownerNode
    served: true
    storage: true
    subresources:
      status: {}
