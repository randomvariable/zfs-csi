  names:
    kind: NVMeExport
    listKind: NVMeExportList
    plural: nvmeexports
    shortNames:
    - nvex
    singular: nvmeexport
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.targetNQN
      name: NQN
      type: string
    - jsonPath: .spec.devicePath
      name: Device
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .status.activeConnection
      name: Active
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NVMeExport declares a desired NVMe-oF subsystem+namespace+ACL set that the
          nvmet controller materialises in configfs.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              NVMeExportSpec is DESIRED state. Written solely by the export's creator
              (e.g. the zfs-csi storage agent). The nvmet controller treats it read-only.
            properties:
              allowedInitiators:
                description: |-
                  allowedInitiators is the DESIRED allow-host set (initiator NQNs). The
                  controller reconciles configfs allowed_hosts to EXACTLY this set.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              deviceGUID:
                description: deviceGUID is embedded in the namespace NGUID/EUI for
                  stable identity.
                type: string
              devicePath:
                description: |-
                  devicePath is the absolute host path to the backing block device
                  (/dev/zvol/... for zfs, /dev/rbd0 for ceph, /dev/mapper/... for lvm).
                  Written verbatim to configfs namespaces/<id>/device_path; the controller
                  does NOT interpret it.
                pattern: ^/.+
                type: string
              namespaceID:
                default: 1
                description: namespaceID is the 1-based NVMe namespace id.
                format: int32
                minimum: 1
                type: integer
              portal:
                description: portal is host:port the initiator connects to (nvmet
                  port address).
                type: string
              targetNQN:
                description: targetNQN is the NVMe subsystem NQN to own (deterministic
                  per volume).
                minLength: 1
                type: string
            required:
            - devicePath
            - portal
            - targetNQN
            type: object
          status:
            description: NVMeExportStatus is OBSERVED state. Written solely by the
              nvmet controller.
            properties:
              activeConnection:
                description: |-
                  activeConnection reports whether any initiator holds a live transport
                  connection. Gates safe teardown on delete.
                type: boolean
              admittedInitiators:
                description: |-
                  admittedInitiators is the CONFIRMED allow-host set present in configfs.
                  The consumer polls this to confirm a publish.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              conditions:
                description: conditions carries reconcile health.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the spec generation the controller
                  last reconciled.
                format: int64
                type: integer
              state:
                description: state is the reconcile lifecycle state.
                enum:
                - Pending
                - Ready
                - Deleting
                - Error
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
