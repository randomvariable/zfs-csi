{{- $root := . }}
{{- $explicit := gt (len .Values.storageOwners) 0 }}
{{- if and $explicit .Values.storageNode.name }}
{{- fail "storageOwners cannot be combined with legacy storageNode.name" }}
{{- end }}
{{- $owners := .Values.storageOwners }}
{{- if not $explicit }}
{{- if and .Values.storageNode.name .Values.storageNode.authoritativePoolGUIDs .Values.storageNode.networkDomain }}
{{- $owners = list (dict "name" .Values.storageNode.name "enabled" .Values.storageNode.enabled "authoritativePoolGUIDs" .Values.storageNode.authoritativePoolGUIDs "networkDomain" .Values.storageNode.networkDomain) }}
{{- else }}
{{- $owners = list }}
{{- end }}
{{- end }}
{{- range $owner := $owners }}
{{- $enabled := true }}
{{- if hasKey $owner "enabled" }}{{- $enabled = $owner.enabled }}{{- end }}
{{- if $enabled }}
---
apiVersion: zfs.csi.randomvariable.co.uk/v1alpha1
kind: StorageNode
metadata:
  name: {{ $owner.name }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  authoritativePoolGUIDs:
{{ toYaml $owner.authoritativePoolGUIDs | indent 4 }}
  enabled: true
  networkDomain: {{ $owner.networkDomain | quote }}
{{- end }}
{{- end }}
