volumeBindingMode: Immediate
allowVolumeExpansion: true
---
{{- end }}
{{- if and .Values.storageClasses.tankNFSTLS.enabled .Values.network.tls.enabled .Values.encryption.enabled .Values.controller.enabled .Values.node.enabled .Values.storage.enabled }}
{{- $nfsExportCIDRs := required "storageClasses.tankNFSTLS.nfsExportCIDRs is required when tankNFSTLS is enabled" .Values.storageClasses.tankNFSTLS.nfsExportCIDRs }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storageClasses.tankNFSTLS.name }}-encrypted
provisioner: zfs.csi.randomvariable.co.uk
parameters:
  pool: {{ .Values.storageClasses.tankNFSTLS.pool }}
  type: filesystem
  nfsExportCIDRs: {{ join "," $nfsExportCIDRs | quote }}
  nfsTLS: "true"
  encrypted: "true"
reclaimPolicy: {{ .Values.storageClasses.tankNFSTLS.reclaimPolicy }}
volumeBindingMode: Immediate
allowVolumeExpansion: true
---
{{- end }}
{{- if and .Values.storageClasses.tankNVMeTLS.enabled .Values.network.tls.enabled .Values.controller.enabled .Values.node.enabled .Values.storage.enabled }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storageClasses.tankNVMeTLS.name }}
provisioner: zfs.csi.randomvariable.co.uk
parameters:
  pool: {{ .Values.storageClasses.tankNVMeTLS.pool }}
  type: block
  transport: nvme-tcp
  # Filesystem mode only; raw block consumers ignore this hint.
  csi.storage.k8s.io/fstype: {{ .Values.storageClasses.tankNVMeTLS.fsType }}
  blocksize: {{ .Values.storageClasses.tankNVMeTLS.blocksize | quote }}
  nvmeTLS: "true"
{{- with .Values.storageClasses.tankNVMeTLS.mountOptions }}
mountOptions:
{{ toYaml . | indent 2 }}
{{- end }}
reclaimPolicy: {{ .Values.storageClasses.tankNVMeTLS.reclaimPolicy }}
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
{{- end }}
{{- if and .Values.storageClasses.tankNVMeTLS.enabled .Values.network.tls.enabled .Values.encryption.enabled .Values.controller.enabled .Values.node.enabled .Values.storage.enabled }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storageClasses.tankNVMeTLS.name }}-encrypted
provisioner: zfs.csi.randomvariable.co.uk
parameters:
  pool: {{ .Values.storageClasses.tankNVMeTLS.pool }}
  type: block
  transport: nvme-tcp
  csi.storage.k8s.io/fstype: {{ .Values.storageClasses.tankNVMeTLS.fsType }}
  blocksize: {{ .Values.storageClasses.tankNVMeTLS.blocksize | quote }}
  nvmeTLS: "true"
  encrypted: "true"
{{- with .Values.storageClasses.tankNVMeTLS.mountOptions }}
mountOptions:
{{ toYaml . | indent 2 }}
{{- end }}
reclaimPolicy: {{ .Values.storageClasses.tankNVMeTLS.reclaimPolicy }}
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
{{- end }}
