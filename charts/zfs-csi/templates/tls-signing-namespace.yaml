{{- if and .Values.network.tls.enabled .Values.network.tls.signer.enabled (or .Values.node.enabled .Values.storage.enabled) }}
{{- $driverNamespace := include "zfs-csi.namespace" . }}
{{- $signingNamespace := include "zfs-csi.tlsSigningNamespace" . }}
{{- if ne $signingNamespace $driverNamespace }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $signingNamespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
{{- include "zfs-csi.labels" (dict "context" $ "component" "tls-signing-authority") | nindent 4 }}
{{- end }}
{{- end }}
