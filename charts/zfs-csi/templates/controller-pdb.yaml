{{- if and .Values.controller.enabled .Values.controller.podDisruptionBudget.enabled (gt (int .Values.controller.replicas) 1) }}
# F12: keep at least one controller replica through voluntary disruptions
# (node drain). Provisioning halts while the controller is down; the kernel data
# plane (nvmet targets, nfsd) keeps serving already-attached volumes regardless.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: zfs-csi-controller
  namespace: {{ include "zfs-csi.namespace" . }}
  labels:
{{- include "zfs-csi.labels" (dict "context" $ "component" "controller") | nindent 4 }}
spec:
  minAvailable: {{ .Values.controller.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: zfs-csi
      app.kubernetes.io/component: controller
{{- end }}
